# Site Settings
url                      : "https://pzy2000.github.io"
baseurl                  : ""
lang                     : "en"
title                    : "Zhiyuan Peng"
title_zh                 : "彭志远"
description              : "Zhiyuan Peng (彭志远), Ph.D. student at the School of Computer Science, Shanghai Jiao Tong University, building LLM agents for agentic coding and multi-agent systems."
description_zh           : "彭志远（Zhiyuan Peng），上海交通大学计算机学院博士研究生，研究方向为大模型智能体（Agent）、Agentic Coding 与多智能体系统，在 ACL、EMNLP、FSE、ASE 等国际顶级会议发表论文。"
keywords                 : "Zhiyuan Peng, Lucius Peng, Shanghai Jiao Tong University, SJTU, LLM agent, agentic coding, multi-agent orchestration, GUI agent, tool use, agent memory, code generation"
keywords_zh              : "彭志远, 上海交通大学, 上海交通大学计算机学院, 上海交大, SJTU, 博士研究生, 大模型智能体, Agent, Agentic Coding, 多智能体系统, 智能体编排, GUI Agent, 工具调用, 智能体记忆, 代码生成, 个人主页"
repository               : "pzy2000/pzy2000.github.io"

# google analytics
google_analytics_id      :  # get google_analytics_id from https://analytics.google.com/analytics/

# Build settings
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

timezone: Asia/Shanghai

collections:
  publications:
    output: false
  news:
    output: false

# Plugins (GitHub Pages whitelisted only)
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-paginate
  - jekyll-gist
  - jemoji

# Defaults
defaults:
  # keep the Search Console ownership file out of the sitemap
  - scope:
      path: "google493962243089a10e.html"
    values:
      sitemap: false

# Reading Files
exclude:
  - docs
  - cloudflare-worker
  - google_scholar_crawler
  - scripts
  - _pages
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - LICENSE
  - README.md
  - Rakefile
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
  - run_server.sh
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
