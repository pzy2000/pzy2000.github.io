# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
url                      : "https://pzy2000.github.io"
baseurl                  : ""
lang                     : "en"
title                    : "Zhiyuan Peng"
title_zh                 : "彭志远"
description              : "Zhiyuan Peng (彭志远), Ph.D. student at the School of Computer Science, Shanghai Jiao Tong University, building LLM agents for agentic coding and multi-agent systems."
description_zh           : "彭志远（Zhiyuan Peng），上海交通大学计算机学院博士研究生，研究方向为大模型智能体（Agent）、Agentic Coding 与多智能体系统，在 ACL、EMNLP、FSE、ASE 等国际顶级会议发表论文。"
keywords                 : "Zhiyuan Peng, Lucius Peng, Shanghai Jiao Tong University, SJTU, LLM agent, agentic coding, multi-agent orchestration, GUI agent, tool use, agent memory, code generation"
keywords_zh              : "彭志远, 上海交通大学, 上海交通大学计算机学院, 上海交大, SJTU, 博士研究生, 大模型智能体, Agent, Agentic Coding, 多智能体系统, 智能体编排, GUI Agent, 工具调用, 智能体记忆, 代码生成, 个人主页"
# short blurb shown in the sidebar (kept separate from the SEO description)
tagline                  : "Ph.D. student at Shanghai Jiao Tong University, building LLM agents."
tagline_zh               : "博士研究生，研究方向为大模型智能体、Agentic Coding 与多智能体系统。"
repository               : "pzy2000/pzy2000.github.io"
google_scholar_stats_use_cdn : true

# google analytics
google_analytics_id      :  # get google_analytics_id from https://analytics.google.com/analytics/

# SEO Related
# Google ownership is verified with the file /google493962243089a10e.html, so no meta tag is needed here.
google_site_verification :  # get google_site_verification from https://search.google.com/search-console/about
bing_site_verification   :  # Bing is imported from Search Console, so no token is needed
baidu_site_verification  :  # get baidu_site_verification from https://ziyuan.baidu.com/login/index?u=/site/index

