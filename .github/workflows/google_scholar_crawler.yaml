name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch citation data
        working-directory: ./google_scholar_crawler
        env:
          # Secret 缺失时退回公开的 Scholar ID，避免整个任务因配置丢失而失败
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || 'kfiyUgIAAAAJ' }}
          # Google 对 Actions 的机房 IP 一律 403，必须经 cloudflare-worker/ 的代理取数。
          # 在 Settings → Variables 里配置 SCHOLAR_PROXY_URL 为 Worker 地址。
          SCHOLAR_PROXY_URL: ${{ vars.SCHOLAR_PROXY_URL }}
        run: python3 main.py
      - name: Push to google-scholar-stats branch
        working-directory: ./google_scholar_crawler/results
        run: |
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -q -m "Update citation data"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats
