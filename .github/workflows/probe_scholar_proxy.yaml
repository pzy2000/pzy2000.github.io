name: Probe Scholar Proxy

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Debug endpoint
        run: |
          curl -sS -m 30 -H "Origin: https://pzy2000.github.io" \
            "https://scholar-proxy.pzy2000.workers.dev/?debug=1" | python3 -m json.tool

      - name: Force fresh scrape and show errors
        run: |
          set -euo pipefail
          code=$(curl -sS -m 90 -o /tmp/w3.json -w "%{http_code}" \
            -H "Origin: https://pzy2000.github.io" \
            "https://scholar-proxy.pzy2000.workers.dev/?fresh=1")
          echo "HTTP $code"
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/w3.json"))
          print(json.dumps({k:d.get(k) for k in
            ["citedby","hindex","cached","stale","throttled","error","error_message","updated","source"]},
            ensure_ascii=False, indent=2))
          pubs=d.get("publications") or []
          print("pubs", len(pubs))
          if pubs and pubs[0].get("authors"):
              print("live scrape OK — authors present:", pubs[0]["authors"][:80])
          elif d.get("error") or d.get("error_message"):
              print("SCRAPE FAILED:", d.get("error") or d.get("error_message"))
          else:
              print("still on snapshot (no authors field)")
          PY

      - name: Debug after fresh
        run: |
          curl -sS -m 30 -H "Origin: https://pzy2000.github.io" \
            "https://scholar-proxy.pzy2000.workers.dev/?debug=1" | python3 -m json.tool
