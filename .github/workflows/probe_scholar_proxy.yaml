name: Probe Scholar Proxy

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Self-test ScraperAPI variants
        run: |
          set -uo pipefail
          for i in 1 2 3 4; do
            echo "=== selftest $i ==="
            curl -sS -m 180 "https://scholar-proxy.pzy2000.workers.dev/?selftest=$i&cb=$RANDOM" \
              | python3 -m json.tool || echo "(request failed)"
            echo
          done

      - name: Force fresh scrape
        run: |
          set -uo pipefail
          curl -sS -m 180 -o /tmp/w.json \
            -H "Origin: https://pzy2000.github.io" \
            "https://scholar-proxy.pzy2000.workers.dev/?fresh=1"
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/w.json"))
          pubs=d.get("publications") or []
          print(json.dumps({k:d.get(k) for k in
            ["citedby","hindex","cached","stale","error","error_message","updated","source"]},
            ensure_ascii=False, indent=2))
          print("pubs", len(pubs))
          if pubs and pubs[0].get("authors"):
              print("LIVE OK:", pubs[0]["authors"][:80])
          else:
              print("NOT LIVE")
          PY
