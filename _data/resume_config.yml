  - ["Benchmark 构建", "执行环境设计、自动化正确性判定（构建-启动-调用）、指标设计（Pass@k / Play@k / Gas@k）", "RepoGenesis、SolEval"]
  - ["智能体", "规划与工具调用（tool use）、GUI 交互、多智能体协作与交叉校验、容器化隔离与批量 rollout", "PlayCoder、OpenHire"]
  - ["数据与记忆", "执行轨迹采集留存与筛选、skill 抽取复用、长期记忆合并与安全回滚", "RepoGenesis、SoulBanner"]

