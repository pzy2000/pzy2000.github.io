# Agent 项目在简历中的一句话版本（留空则自动取主页描述的第一句）
# 写法原则：不列功能清单，只说规模、验证方式和它支撑了什么可验证的结果。
project_summaries:
  OpenHire: "多智能体执行基础设施：control agent 拆解任务并分发到容器化 worker，各自独立沙箱与权限边界，支持批量 rollout、轨迹留存与 skill / 长期记忆沉淀。"
  YimMenu: "游戏内长程驾驶 Agent：感知-决策-控制闭环，自主导航与漫游，含控制冲突检测与人工接管让行，经约 2,000 公里连续驾驶验证。"
  SoulBanner: "Agent Skill 库：把表达风格与判断框架蒸馏为可调用、可组合的 skill 模块，6 分类路由入口，已接入 OpenHire 的 Skill Catalog。"
  RepoGenesis: "ACL'26 基准的开源实现：README → 可部署多语言微服务仓库，在 Docker 沙箱内以构建、启动、调用三步自动判定，覆盖 11 框架 / 18 领域。"
  GOF2_remake: "Agent 从零到一自动开发的可运行 WebGL 游戏：136 次提交长程迭代，交付 6 星系 / 9 舰船 / 13 章主线与经济服务端；生成式资产经 manifest 统一调度，Playwright e2e 把可玩性变成每轮迭代的自动回归。"
  LoveEmulator: "可控的程序化游戏内容生成：引擎采样情境骨架 → LLM 生成叙事与选项 → 校验层查结构、安全与一致性 → 引擎按 intent 标签和 RNG 种子确定性结算，兼顾多样性与可复现。"

# 科研成果矩阵：树状总览。每行一个研究问题（Q1/Q2/Q3），向右分出若干子方向（branches），
# 每个子方向后横排若干 chip（items）。item 先按论文 key 匹配主页论文列表，匹配不到再按
# 开源项目名匹配；论文 chip 显示会议缩写，项目 chip 显示 project_source_label（GitHub）以示区分。
# 矩阵下方的详细列表只包含矩阵里出现过的同行评议论文（去重、按首次出现顺序），带结果行。
# tone 可选 blue / green / amber。
research_matrix:
  - id: "Q1"
    question: "为模型构造可验证的执行环境"
    tone: "blue"
    branches:
      - label: "仓库级判定"
        items: ["RepoGenesis", "SolEval"]
      - label: "交互式判定"
        items: ["PlayCoder"]
  - id: "Q2"
    question: "把执行与偏好反馈转为可优化目标"
    tone: "green"
    branches:
      - label: "监督微调"
        items: ["SolEval"]
      - label: "偏好优化"
        items: ["PrefGen"]
  - id: "Q3"
    question: "将 Agent 扩展到长程多智能体任务"
    tone: "amber"
    branches:
      - label: "编排与执行"
        items: ["OpenHire", "YimMenu"]
      - label: "游戏生成与长程迭代"
        items: ["GOF2_remake", "LoveEmulator"]
      - label: "技能与记忆"
        items: ["SoulBanner"]

# 开源项目 chip 的来源标注（论文 chip 显示会议缩写，项目 chip 显示这个）
project_source_label: "GitHub"

# 每篇论文的核心实验结果，显示在标题行下方。按论文 key 匹配。
paper_results:
  RepoGenesis: "106 个多语言微服务仓库，11 框架 / 18 领域、2,335 测试用例；SOTA 系统 Pass@1 仅 23.7%。"
  PlayCoder: "43 个 GUI 游戏应用，提出 Play@k 与自动判定 agent；10 个 SOTA 模型 Play@3 均为个位数，生成-评测-修复流程达 20.3%。"
  SolEval: "首个 Solidity 代码基准，1,507 任务 / 28 仓库；16 个模型最佳仅 26.3% Pass@10，SFT 后 Pass@5 16.7%→58.3%。"
  PrefGen: "把 Gas 与安全设为可量化奖励扩展 DPO；Qwen2.5-7B 上 Pass@5 16.7%→66.7%、Secure@5 11.8%→62.5%。"

# 论文的额外标注（会议档次、录用率、奖项），显示在会议/等级标签之后。按论文 key 匹配。
paper_badges:
  RepoGenesis: ["Main Conference"]
  SolEval: ["Main Conference"]

