# 简要介绍：主页首段偏叙事，简历需要更紧凑的版本。留空则回退到主页首段。
summary: >-
  我是上海交通大学计算机科学学院博士 3 年级学生，曾在腾讯 LIGHTSPEED（**青云计划**）和微软研究院（MSRA）实习，
  研究兴趣是 **LLM 智能体**、**Agentic Coding** 与**多智能体系统**：让智能体在真实执行环境中规划、调用工具并采取行动，
  从交付可运行仓库的 Coding Agent（[RepoGenesis](https://arxiv.org/abs/2601.13943)）到角色化智能体集群
  （[OpenHire](https://github.com/pzy2000/OpenHire)）。在游戏方向上，我既做**可玩性的自动判定**
  （[PlayCoder](https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/4/PlayCoder-Making-LLM-Generated-GUI-Code-Playable)），
  也用 Agent **从零到一开发可运行的游戏**（[GOF2_remake](https://github.com/pzy2000/GOF2_remake) /
  [LoveEmulator](https://github.com/pzy2000/LoveEmulator)）。多篇一作论文发表于 ACL、EMNLP、FSE、ASE。

