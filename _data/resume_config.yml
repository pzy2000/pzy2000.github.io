# 简要介绍：主页首段偏叙事，简历需要更紧凑的版本。留空则回退到主页首段。
summary: >-
  研究方向为**大模型智能体（Agent）**与 **Agentic Coding**：让 Agent 在真实执行环境中规划、调用工具并采取行动——
  从单个交付可运行仓库的 Coding Agent，到可治理的角色化**多智能体**团队，并把执行轨迹沉淀为可复用 Skill
  与长期记忆以实现**自进化**。主导的基准与平台一律以「跑得起来」为验收标准：在沙箱内真实构建、启动并调用生成物，而非静态检查代码。

