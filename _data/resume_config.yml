# Agent 项目在简历中的一句话版本（留空则自动取主页描述的第一句）
project_summaries:
  OpenHire: "数字员工编排平台：control agent 拆解模糊目标并分发给容器化的角色化 worker agent，每个 worker 拥有隔离工作区与权限边界；可插拔 adapter 接入任意镜像化 agent，支持 CLI / OpenAI 兼容 API / 飞书渠道；成功运行沉淀为可复用 skill 与长期记忆。"
  SoulBanner: "多人格 `.skill` monorepo：把表达风格与判断框架蒸馏为可调用、可组合的 agent skill 模块，含 6 分类路由入口，已被 OpenHire 的 Skill Catalog 直接接入。"
  RepoGenesis: "端到端基准：从 README 生成可部署的多语言 Web 微服务仓库，在 Docker 沙箱中真实构建、启动、调用以验证可运行性，覆盖 11 个框架与 18 个应用领域。"
  YimMenu: "Auto Drive agent：感知-决策-控制闭环，沿道路导航至地图路径点、无目标时自主漫游，支持控制冲突检测与人工接管让行，经约 2,000 公里长程驾驶验证。"

