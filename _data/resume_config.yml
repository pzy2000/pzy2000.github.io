# Agent 项目在简历中的一句话版本（留空则自动取主页描述的第一句）
# 写法原则：不列功能清单，只说规模、验证方式和它支撑了什么可验证的结果。
project_summaries:
  OpenHire: "多智能体执行与评测基础设施：control agent 拆解任务后并行分发到容器化 worker，每个 worker 独立沙箱与权限边界，支持批量 rollout 与执行轨迹全量留存；轨迹经筛选沉淀为可复用 skill 与长期记忆，构成自进化的数据闭环。适配层可接入任意镜像化 agent。"
  YimMenu: "长程自动驾驶模块：基于规则的感知-决策-控制闭环，沿道路导航至地图路径点、无目标时自主漫游，含控制冲突检测与人工接管让行，经约 2,000 公里连续驾驶验证。"
  SoulBanner: "Agent Skill 库：把表达风格与判断框架蒸馏为可调用、可组合的 skill 模块，6 分类路由入口，已接入 OpenHire 的 Skill Catalog。"
  RepoGenesis: "ACL'26 基准的开源实现：README → 可部署多语言微服务仓库，在 Docker 沙箱内以构建、启动、调用三步自动判定成败，覆盖 11 框架 / 18 领域。"

# 科研成果矩阵：按研究问题分组，每组下直接列完整论文条目（含结果行）。
# 只放经同行评议的论文，不混入 GitHub 项目——否则会把论文拉到和项目同一等级。
research_matrix:
  - id: "Q1"
    question: "如何构建能自动判定成败的代码执行环境？"
    tone: "blue"
    papers: ["RepoGenesis", "PlayCoder"]
  - id: "Q2"
    question: "如何用执行与偏好反馈提升生成质量？"
    tone: "green"
    papers: ["SolEval", "PrefGen"]

# 每篇论文的核心实验结果，显示在标题行下方。按论文 key 匹配。
paper_results:
  RepoGenesis: "106 个多语言微服务仓库的 Benchmark。覆盖 11 框架 18 领域、2,335 测试用例；SOTA 系统 DSR 达 100% 但 Pass@1 仅 23.7%。"
  PlayCoder: "覆盖 43 个 GUI 应用，提出 Play@k 与自动判定 agent；10 个 SOTA 模型 Play@3 全为个位数，多智能体生成-评测-修复达 20.3% Play@3。"
  SolEval: "首个 Solidity Coding 基准，1,507 任务 / 28 仓库；在 16 个模型上最佳仅 26.3% Pass@10，SFT 后 Pass@5 由 16.7% 升至 58.3%。"
  PrefGen: "将 Gas 与安全设计为可量化奖励扩展 DPO；Qwen2.5-7B 上 Pass@5 16.7%→66.7%、Gas@5 0%→58.9%、Secure@5 11.8%→62.5%。"

