short_bio: >-
  <p>Hi 👋 I am <strong>Zhiyuan Peng</strong> (彭志远, Lucius Peng), a second-year Ph.D. student at the School of Computer Science, <a href="https://en.sjtu.edu.cn/" target="_blank">Shanghai Jiao Tong University</a>. Previously, I was fortunate to intern at Tencent LIGHTSPEED Studios (<strong>Qingyun Program</strong>) and Microsoft Research Asia (MSRA).</p>
  <p>My research interests include <strong>LLM Agents</strong>, <strong>Agentic Coding</strong>, and <strong>Multi-Agent Systems</strong>. I build agents that plan, call tools, and act inside real execution environments, from a single coding agent that ships a runnable repository to a governed fleet of role-based agents. I have published papers at top international conferences such as <strong>ACL</strong>, <strong>EMNLP</strong>, <strong>FSE</strong>, and <strong>ASE</strong>.</p>
  <p>In 2026, I am leading or participating in the following research topics:</p>
  <ul>
  <li><strong>Agentic Coding</strong>: agents that write, run, and repair code in real execution environments</li>
  <li><strong>Multi-Agent Orchestration</strong>: role-based agent teams with tool, permission, and workspace governance</li>
  <li><strong>Self-Evolving Agents</strong>: distilling execution traces into reusable skills and long-term memory</li>
  </ul>

