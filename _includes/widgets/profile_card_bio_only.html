{% if page.lang == 'zh' %}{% assign profile = site.data.profile_zh %}{% else %}{% assign profile = site.data.profile %}{% endif %}
<div class="mt-3 d-md-none"></div>
<div class="row">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="row px-3 pt-3">
                    <div class="col h3">
                        {% if page.lang == 'zh' %}关于我{% else %}About Me{% endif %}
                    </div>
                </div>
                <div class="row p-3">
                    <div class="col">
                        <div class="text-profile-bio mt-0" {% if profile.short_bio_text_justify %}style="text-align: justify;"{% endif %}>
                            {{ profile.short_bio }}
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
