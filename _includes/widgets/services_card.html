<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <h6>{% if page.lang == 'zh' %}学术服务{% else %}Academic Service{% endif %}</h6>
                <ul class="list small pl-3 mb-1">
                    {% for item in site.data.services.items %}
                    <li>
                        <div class="d-flex">
                            <div>{% if page.lang == 'zh' %}{{ item.name_zh }}{% else %}{{ item.name }}{% endif %}</div>
                        </div>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</div>
